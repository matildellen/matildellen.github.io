<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      max-width: 850px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      color: #111;
    }

    header {
      margin-bottom: 40px;
    }

    .site-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    nav {
      display: flex;
      gap: 20px;
      font-size: 16px;
    }

    nav a {
      text-decoration: none;
      color: #333;
      font-weight: 500;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      margin-top: 30px;
    }
    .hero {
  display: flex;
  align-items: center;
  gap: 25px;
  margin-bottom: 40px;
}

.avatar {
  width: 160px;
  border-radius: 50%;
}

.name {
  font-size: 32px;
  margin: 0;
}

.tagline {
  font-size: 17px;
  color: #444;
  margin-top: 6px;
}
    .contact-links {
  display: flex;
  flex-wrap: nowrap;
  gap: 18px;
  font-size: 15px;
  white-space: nowrap;
  overflow-x: auto;
  padding-bottom: 6px;
  align-items: center;
}

.contact-links a {
  text-decoration: none;
  font-weight: 500;
  color: #333;
}

.contact-links a:hover {
  text-decoration: underline;
}
  </style>
</head>
<body>

<header>
  <div class="site-title">{{ site.title }}</div>
  <nav>
    <a href="/">Home</a>
    <a href="/research">Research</a>
    <a href="/publications">Publications</a>
  </nav>
</header>

<main>
  {{ content }}
</main>

</body>
</html>
